services:
  backend:
    # Prebuilt by GitHub Actions on every push to main; `docker compose build`
    # still builds it locally under the same name.
    image: ghcr.io/bardkidd/firedashboard-backend:latest
    build: ./backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./data:/data

  frontend:
    image: ghcr.io/bardkidd/firedashboard-frontend:latest
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Set FIRE_PORT / FIRE_BIND in .env (see .env.example).
      # The default 127.0.0.1 is reachable only from this machine; 0.0.0.0 opens it to the network with no login.
      - "${FIRE_BIND:-127.0.0.1}:${FIRE_PORT:-8080}:80"
